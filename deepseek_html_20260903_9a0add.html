<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire Airtable · Design épuré</title>
    <style>
        /* — RESET & BASE — */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #FBF1EE 0%, #FBF1EE 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
        }

        /* — CARTE PRINCIPALE — */
        .form-card {
            max-width: 880px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.8);
            padding: 1.75rem 1.75rem 1.5rem;
            transition: box-shadow 0.3s ease, transform 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .form-card:hover {
            box-shadow: 0 30px 60px -15px rgba(0, 20, 30, 0.3);
            transform: translateY(-2px);
        }

        /* — EN-TÊTE — */
        .form-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            padding-left: 0.25rem;
        }

        .form-header .logo-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: #1c2b3a;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b1a26;
            background: linear-gradient(135deg, #1a2f3f, #2c4b5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-header .badge {
            margin-left: auto;
            background: #d0e1ed;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #1d3a4e;
            text-transform: uppercase;
            border: 1px solid rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
        }

        /* — CONTENEUR IFRAME — */
        .iframe-wrapper {
            position: relative;
            width: 100%;
            border-radius: 1.8rem;
            overflow: hidden;
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.06),
                inset 0 1px 1px rgba(255, 255, 255, 0.6);
            background: #ffffff;
            transition: box-shadow 0.25s;
        }

        .iframe-wrapper::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 1.8rem;
            padding: 1px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.6), rgba(200, 215, 225, 0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .iframe-wrapper iframe {
            display: block;
            width: 100%;
            height: 533px;
            border: none;
            background: transparent;
            transition: height 0.2s ease;
        }

        /* — PIED DE PAGE (optionnel) — */
        .form-footer {
            margin-top: 1.2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 0.8rem;
            color: #3a5a6e;
            padding-right: 0.3rem;
            gap: 1rem;
        }

        .form-footer span {
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.7;
            letter-spacing: 0.2px;
        }

        .form-footer .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #3b9e7e;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(59, 158, 126, 0.2);
        }

        /* — RESPONSIVE — */
        @media (max-width: 600px) {
            .form-card {
                padding: 1rem 1rem 0.8rem;
                border-radius: 2rem;
            }

            .form-header h2 {
                font-size: 1.2rem;
            }

            .form-header .badge {
                font-size: 0.6rem;
                padding: 0.15rem 0.7rem;
            }

            .iframe-wrapper iframe {
                height: 500px;
            }
        }

        @media (max-width: 420px) {
            .form-header .logo-icon {
                width: 34px;
                height: 34px;
                font-size: 0.9rem;
            }

            .iframe-wrapper iframe {
                height: 470px;
            }

            .form-footer {
                flex-direction: column;
                align-items: flex-end;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">

        <!-- Zone iframe avec effet de profondeur -->
        <div class="iframe-wrapper">
            <iframe class="airtable-embed" src="https://airtable.com/embed/appQtbXfiqBJIP6xM/pagIMeEA8vsGI9jho/form"
                frameborder="0" onmousewheel="" width="100%" height="533"
                style="background: transparent; border: 1px solid #ccc;"></iframe>
        </div>
    </div>
</body>

</html>
